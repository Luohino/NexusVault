<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusVault // BREACH PROTOCOL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Matrix Rain Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <!-- CRT Scanline Overlay -->
    <div class="crt-overlay"></div>

    <!-- Boot Screen -->
    <div id="boot-screen" class="boot-screen active">
        <div class="boot-logo">⬡</div>
        <h1 class="boot-title">NEXUSVAULT</h1>
        <p class="boot-subtitle">BREACH PROTOCOL v2.1</p>
        <div class="boot-loader">
            <div class="boot-loader-bar" id="boot-bar"></div>
        </div>
        <p class="boot-status" id="boot-status">Initializing kernel...</p>
    </div>

    <!-- Main Game Screen -->
    <div id="game-screen" class="game-screen">
        <!-- HUD Bar -->
        <div class="hud">
            <div class="hud-left">
                <span class="hud-tag">OPERATOR</span>
                <span class="hud-val" id="hud-level">NODE 1/29</span>
            </div>
            <div class="hud-center">
                <div class="xp-bar-wrap">
                    <div class="xp-bar" id="xp-bar"></div>
                </div>
            </div>
            <div class="hud-right">
                <span class="hud-tag">SCORE</span>
                <span class="hud-val hud-score" id="hud-score">0</span>
                <div class="hearts" id="hearts">
                    <span class="h">♥</span><span class="h">♥</span><span class="h">♥</span>
                </div>
            </div>
        </div>

        <!-- Node Map (visual progress) -->
        <div class="node-map" id="node-map"></div>

        <!-- Terminal Card -->
        <div class="terminal" id="terminal">
            <div class="terminal-header">
                <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                <span class="terminal-title" id="terminal-title">firewall_0x01.sys</span>
            </div>
            <div class="terminal-body">
                <p class="term-prefix">[INTEL]</p>
                <p class="term-explanation" id="term-explanation"></p>
                <p class="term-prefix question-prefix">[QUERY]</p>
                <p class="term-question" id="term-question"></p>

                <!-- Multiple Choice Options -->
                <div class="choices" id="choices"></div>

                <!-- Phase 2: Type to Confirm -->
                <div class="confirm-phase" id="confirm-phase">
                    <p class="confirm-label">[CONFIRM] Type the answer to prove you learned it:</p>
                    <div class="confirm-input-wrap">
                        <input type="text" id="confirm-input" class="confirm-input" placeholder="Type the answer..." autocomplete="off" spellcheck="false">
                        <button class="confirm-btn" id="confirm-btn">EXECUTE</button>
                    </div>
                    <p class="confirm-feedback" id="confirm-feedback"></p>
                </div>

                <!-- Hint -->
                <button class="hint-btn" id="hint-btn">⚡ DECRYPT HINT</button>
                <p class="hint-text" id="hint-text"></p>
            </div>
        </div>

        <!-- Combo indicator -->
        <div class="combo-popup" id="combo-popup"></div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2 class="modal-title" id="modal-title"></h2>
            <p class="modal-text" id="modal-text"></p>
            <div class="modal-score" id="modal-score"></div>
            <button class="modal-btn" id="modal-btn">REINITIALIZE</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
